plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.lombok' version '2.1.20'
    id 'io.freefair.lombok' version "9.2.0"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${minecraft_version}"
}

repositories {
    // maven-central mirror: repo.maven.apache.org is rate-limited (429) from this network
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
    mavenLocal()
    maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
    maven { url = "https://maven.quiltmc.org/repository/release" } // Quilt Mappings
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    } // Modrinth File
    maven { // Flywheel
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.jozufozu.flywheel")
        }
    }
    maven { url = "https://jitpack.io/" } // Mixin Extras
    maven {
        url "https://cursemaven.com"
    }
}

configurations {
    // dev-only dependencies: on this project's classpaths, never published, so downstream
    // consumers do not have to add the matching repositories to resolve our pom
    localImplementation
    runtimeClasspath.extendsFrom localImplementation
    compileOnly.extendsFrom localImplementation

    // the runtime-only flavour of the above: present when we run the game, absent from
    // the compile classpath and from the published metadata
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        freeCompilerArgs.add("-Xcontext-parameters")
        freeCompilerArgs.add("-Xwhen-guards")
    }
}

loom {
    accessWidenerPath = file("src/main/resources/ldlib2.accesswidener")
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.kotlin { srcDir("src/main/java") }

dependencies {
    // Fabric toolchain
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${fabric_language_kotlin_version}"

    implementation("org.jetbrains.kotlin:kotlin-stdlib:${kotlin_stdlib_version}") {
        exclude group: "org.jetbrains", module: "annotations"
    }

    // Yoga layout engine
    implementation "org.appliedenergistics.yoga:yoga:${yoga_version}"
    include(group: 'org.appliedenergistics.yoga', name: 'yoga', version: "${yoga_version}")

    // Taffy
    implementation "dev.vfyjxf:taffy:${taffy_version}"
    include(group: 'dev.vfyjxf', name: 'taffy', version: "${taffy_version}")

    // Iris & Sodium for shader pass compatibility
    localImplementation("maven.modrinth:sodium:${sodium_version}")
    localImplementation("maven.modrinth:iris:${iris_version}")

    // JUnit 5
    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    modImplementation "curse.maven:architectury-api-419699:5786326"

    // mock
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'

    // JSR305 annotations
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "mod_id": project.mod_id,
                "mod_name": project.mod_name,
                "mod_description": project.mod_description,
                "mod_url": project.mod_url,
                "mod_license": project.mod_license
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}-${minecraft_version}"
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

test {
    useJUnitPlatform()
}
